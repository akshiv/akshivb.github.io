---
layout: default
---
<!-- start banner Area -->
<section class="banner-area relative">
	<div class="container">
		<div class="row d-flex align-items-center justify-content-center">
			<div class="about-content col-lg-12">
				<h1 class="text-white">
					{{ page.title }}
				</h1>
				<p class="link-nav">
					<span class="box">
						<a href="{{ '/index.html' | relative_url }}">Home </a>
						<a href="{{ '/blog.html' | relative_url }}">Blog</a>
						<a href="#">{{ page.title }}</a></p>
				</span>
			</div>
		</div>
	</div>
</section>
<!-- End banner Area -->

<!-- Post Details Area -->
<section class="portfolio_details_area section-gap">
	<div class="container">
		<p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
		<div class="post-content">
			{{ content }}
		</div>
	</div>
</section>
<!-- End Post Details Area -->
